name: Deploy Binangonan report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify approved public dataset
        run: node scripts/verify-public-data.cjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html README.html .nojekyll _site/
          cp styles.css print-report.css dengue-report.css dengue-details.css surveillance.css batch-upload.css presentation.css _site/
          cp seed-data.js print-report.js reference-thresholds.js thresholds.js dengue-report.js dengue-details.js surveillance-app.js public-data.js dengue-seed-data.js dengue-import-bootstrap.js lepto-import-bootstrap.js batch-upload.js presentation.js case-identity.js _site/
          cp -R assets _site/assets
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
