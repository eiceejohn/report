name: Deploy Binangonan report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify public seed is empty
        run: |
          node -e "const fs=require('fs'),vm=require('vm'),ctx={window:{}};vm.runInNewContext(fs.readFileSync('seed-data.js','utf8'),ctx,{timeout:1000});if(!Array.isArray(ctx.window.LEPTOS_SEED_DATA)||ctx.window.LEPTOS_SEED_DATA.length!==0)throw Error('Public deployments must not bundle patient records');"
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html README.html .nojekyll _site/
          cp styles.css print-report.css dengue-report.css surveillance.css _site/
          cp seed-data.js print-report.js reference-thresholds.js thresholds.js dengue-report.js surveillance-app.js public-data.js _site/
          cp -R assets _site/assets
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
